plugins { id 'com.android.application' }

android {
    namespace 'com.sweepmytv.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sweepmytv.launcher'
        minSdk 26          // Android 8.0, the first with home-screen channels (TvContract preview programs)
        targetSdk 35
        // Each release: versionName as in CHANGELOG.md, versionCode one higher (Android installs only higher codes as updates).
        versionCode 71
        versionName '1.3.0-sweep.25'
    }
    // The project's release key, when this computer has it (release.properties, never in git): APKs signed with it
    // can update each other as a single Sweep TV release. Anyone else's build signs with their own debug key.
    def releaseProps = new Properties()
    def releaseFile = rootProject.file('release.properties')
    if (releaseFile.exists()) releaseFile.withInputStream { releaseProps.load(it) }
    signingConfigs {
        debug { storeFile rootProject.file("../tools/signing/sweep-debug.keystore") }
        if (releaseProps.storeFile) {
            release {
                storeFile file(releaseProps.storeFile)
                storePassword releaseProps.storePassword
                keyAlias releaseProps.keyAlias
                keyPassword releaseProps.keyPassword
            }
        }
    }
    buildTypes {
        release {
            // Strips code nothing uses and shortens names: the APK goes from about 4 MB to a few hundred KB.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseProps.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED'
        }
    }
}

// No libraries: Android's own framework only, which keeps the APK and memory small.
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
