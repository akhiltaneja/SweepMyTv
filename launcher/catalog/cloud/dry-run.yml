name: Private India catalog dry run

on:
  schedule:
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [public-source-probe, compare, refresh]
        default: public-source-probe

permissions:
  contents: read
  actions: read

concurrency:
  group: sweep-catalog-dry-run
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the private runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          python3 -m unittest discover -s launcher/tests -p 'test_*.py'
      - name: Probe public sources from the runner
        if: inputs.mode == 'public-source-probe'
        run: |
          python3 launcher/catalog/cloud/probe.py --output "$RUNNER_TEMP/catalog-comparison"
      - name: Restore the private catalog
        if: github.event_name == 'schedule' || inputs.mode != 'public-source-probe'
        env:
          GH_TOKEN: ${{ github.token }}
          SAVE_STATE: ${{ github.event_name == 'schedule' || inputs.mode == 'refresh' }}
        run: |
          if [ "$SAVE_STATE" = true ]; then
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=catalog-state&per_page=10" \
              --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
            if [ -n "$run_id" ]; then
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name catalog-state --dir "$RUNNER_TEMP"
              exit 0
            fi
          fi
          gh release download catalog-baseline --repo "$GITHUB_REPOSITORY" \
            --pattern catalog.sqlite3 --dir "$RUNNER_TEMP"
      - name: Refresh and compare
        if: github.event_name == 'schedule' || inputs.mode != 'public-source-probe'
        env:
          SWEEP_TMDB_TOKEN: ${{ secrets.SWEEP_TMDB_TOKEN }}
          SAVE_STATE: ${{ github.event_name == 'schedule' || inputs.mode == 'refresh' }}
        run: |
          test -n "$SWEEP_TMDB_TOKEN"
          args=(--db "$RUNNER_TEMP/catalog.sqlite3" --output "$RUNNER_TEMP/catalog-comparison")
          if [ "$SAVE_STATE" = true ]; then
            args+=(--save-state "$RUNNER_TEMP/accepted/catalog.sqlite3")
          fi
          python3 launcher/catalog/cloud/dry-run.py "${args[@]}"
      - name: Save the accepted private catalog
        if: github.event_name == 'schedule' || inputs.mode == 'refresh'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-state
          path: ${{ runner.temp }}/accepted/catalog.sqlite3
          retention-days: 30
          if-no-files-found: error
      - name: Publish the TV catalogue to Cloudflare
        if: github.event_name == 'schedule' || inputs.mode == 'refresh'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare publishing awaits repository secrets."
            exit 0
          fi
          python3 launcher/catalog/cloud/prepare-public.py --db "$RUNNER_TEMP/accepted/catalog.sqlite3"
          npx --yes --package=wrangler@4.164.0 wrangler deploy --cwd launcher/catalog/cloud
      - name: Save the private report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-comparison
          path: ${{ runner.temp }}/catalog-comparison/comparison.json
          retention-days: 7
          if-no-files-found: ignore
